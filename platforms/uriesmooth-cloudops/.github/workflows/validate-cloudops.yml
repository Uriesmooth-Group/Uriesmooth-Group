name: Validate Uriesmooth CloudOps foundation

on:
  pull_request:
    paths:
      - "platforms/uriesmooth-cloudops/**"
  push:
    branches: [main]
    paths:
      - "platforms/uriesmooth-cloudops/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Validate operation contract
        run: python -c "import json; from pathlib import Path; p=Path('platforms/uriesmooth-cloudops/contracts/operation-request.schema.json'); d=json.loads(p.read_text()); assert d['type']=='object'; assert 'request_id' in d['required']; print('CloudOps operation schema: valid JSON')"
      - name: Verify foundation documents
        run: |
          test -s platforms/uriesmooth-cloudops/README.md
          test -s platforms/uriesmooth-cloudops/docs/ARCHITECTURE.md
          test -s platforms/uriesmooth-cloudops/docs/SECURITY-GOVERNANCE.md
          test -s platforms/uriesmooth-cloudops/docs/OCI-ADAPTER.md
          test -s platforms/uriesmooth-cloudops/docs/FINOPS.md
          test -s platforms/uriesmooth-cloudops/docs/SLACK-INTEGRATION.md
          test -s platforms/uriesmooth-cloudops/docs/ROADMAP.md
          echo "CloudOps foundation files: present"
