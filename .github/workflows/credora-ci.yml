name: Credora CI

on:
  push:
    paths:
      - "products/uriesmooth-credora/**"
      - ".github/workflows/credora-ci.yml"
  pull_request:
    paths:
      - "products/uriesmooth-credora/**"
      - ".github/workflows/credora-ci.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: products/uriesmooth-credora
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
