name: Validate Uriesmooth CloudOps foundation

on:
  pull_request:
    paths:
      - "platforms/uriesmooth-cloudops/**"
      - ".github/workflows/validate-uriesmooth-cloudops.yml"
  push:
    branches: [main]
    paths:
      - "platforms/uriesmooth-cloudops/**"
      - ".github/workflows/validate-uriesmooth-cloudops.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platforms/uriesmooth-cloudops/service
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run API security and contract tests
        run: pytest
      - name: Build container image
        run: docker build -t uriesmooth-cloudops-api:ci .
      - name: Validate operation request schema
        working-directory: .
        run: python -c "import json; from pathlib import Path; p=Path('platforms/uriesmooth-cloudops/contracts/operation-request.schema.json'); d=json.loads(p.read_text()); assert d['type']=='object'; assert 'request_id' in d['required']; print('CloudOps operation schema: valid JSON')"
      - name: Verify product and deployment documents
        working-directory: .
        run: |
          test -s platforms/uriesmooth-cloudops/README.md
          test -s platforms/uriesmooth-cloudops/docs/PRODUCT-POSITIONING.md
          test -s platforms/uriesmooth-cloudops/docs/ARCHITECTURE.md
          test -s platforms/uriesmooth-cloudops/docs/SECURITY-GOVERNANCE.md
          test -s platforms/uriesmooth-cloudops/docs/OCI-ADAPTER.md
          test -s platforms/uriesmooth-cloudops/docs/FINOPS.md
          test -s platforms/uriesmooth-cloudops/docs/SLACK-INTEGRATION.md
          test -s platforms/uriesmooth-cloudops/docs/ROADMAP.md
          test -s platforms/uriesmooth-cloudops/docs/DEPLOYMENT-RUNBOOK.md
          echo "CloudOps source, tests, container and documentation: present"
